<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Bug Reporter</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <!-- ========================================== -->
        <!-- HEADER -->
        <!-- ========================================== -->

        <div class="header">

            <div class="bug-icon">
                🐞
            </div>

            <div>

                <h2>
                    AI Bug Reporter
                </h2>

                <p>
                    Report bugs faster
                </p>

            </div>

        </div>


        <!-- ========================================== -->
        <!-- BUG DESCRIPTION -->
        <!-- ========================================== -->

        <label for="description">
            Describe the issue
        </label>

        <textarea
            id="description"
            placeholder="Example: Phone option is not appearing on dashboard..."
        ></textarea>


        <!-- ========================================== -->
        <!-- RECORDING BUTTONS -->
        <!-- ========================================== -->

        <button id="startCapture">
            ▶️ Start Recording
        </button>

        <button
            id="stopCapture"
            disabled
        >
            ⏹️ Stop Recording
        </button>

        <button
            id="reportBug"
            disabled
        >
            📸 Capture & Report Bug
        </button>


        <!-- ========================================== -->
        <!-- LOADING -->
        <!-- ========================================== -->

        <div
            id="loading"
            class="loading hidden"
        >
            Capturing bug information...
        </div>


        <!-- ========================================== -->
        <!-- RESULT -->
        <!-- ========================================== -->

        <div
            id="result"
            class="result hidden"
        >

            <h3>
                Bug Information
            </h3>


            <!-- ====================================== -->
            <!-- DESCRIPTION -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    Description
                </span>

                <p id="resultDescription"></p>

            </div>


            <!-- ====================================== -->
            <!-- URL -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    URL
                </span>

                <p id="resultUrl"></p>

            </div>


            <!-- ====================================== -->
            <!-- PAGE TITLE -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    Page Title
                </span>

                <p id="resultTitle"></p>

            </div>


            <!-- ====================================== -->
            <!-- BROWSER -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    Browser
                </span>

                <p id="resultBrowser"></p>

            </div>


            <!-- ====================================== -->
            <!-- CAPTURED TIME -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    Captured At
                </span>

                <p id="resultTime"></p>

            </div>


            <!-- ====================================== -->
            <!-- STEPS TO REPRODUCE -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    Steps to Reproduce
                </span>

                <div id="stepsToReproduce"></div>

            </div>


            <!-- ====================================== -->
            <!-- ACTUAL RESULT -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    Actual Result
                </span>

                <p id="actualResult"></p>

            </div>


            <!-- ====================================== -->
            <!-- EXPECTED RESULT -->
            <!-- ====================================== -->

            <div class="field expected-result-section">

                <span>
                    Expected Result
                </span>

                <textarea
                    id="expectedResultInput"
                    placeholder="Expected result will be generated automatically..."
                    rows="4"
                ></textarea>


                <div class="expected-result-actions">

                    <button id="saveExpectedResult">
                        💾 Save Expected Result
                    </button>

                    <span
                        id="expectedResultSaved"
                        class="saved-message hidden"
                    >
                        ✅ Saved
                    </span>

                </div>


                <!-- Rule Engine / AI Fallback status -->

                <small
                    id="expectedResultSource"
                    class="expected-source"
                ></small>

            </div>


            <!-- ====================================== -->
            <!-- USER ACTIONS -->
            <!-- ====================================== -->

            <div class="field">

                <span>
                    User Actions
                </span>

                <div id="userActions"></div>

            </div>


            <!-- ====================================== -->
            <!-- SCREENSHOT -->
            <!-- ====================================== -->

            <div class="screenshot-container">

                <span>
                    Screenshot
                </span>

                <img
                    id="screenshot"
                    alt="Bug Screenshot"
                >

            </div>

            <div class="video-container">

    <span>Bug Video</span>

    <video
        id="bugVideo"
        controls
        style="width: 100%; margin-top: 10px;"
    >
    </video>

    <p id="videoStatus">
        No video available.
    </p>

</div>


            <!-- ====================================== -->
            <!-- COPY JSON -->
            <!-- ====================================== -->

            <button id="copyJson">
                📋 Copy Bug Data
            </button>

        </div>


        <!-- ========================================== -->
        <!-- ERROR -->
        <!-- ========================================== -->

        <div
            id="error"
            class="error hidden"
        ></div>

    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->

    <script src="popup.js"></script>

</body>

</html>
